<head>

<style>
  :root{

    --t1:#0e9f6e; --t2:#6d28d9; --t3:#d94a4a; --t4:#3f4657;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:12px 20px 0; flex:0 0 auto;
  }
  .h-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:700;letter-spacing:.5px}
  h1 span{color:var(--p1)}
  .sub{font-size:12px;color:var(--ink3)}
  .tabs{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
  .tab{
    padding:8px 15px;font-size:13px;cursor:pointer;border:1px solid transparent;
    border-bottom:none;border-radius:7px 7px 0 0;color:var(--ink2);background:none;
    font-family:inherit;transition:.15s;
  }
  .tab:hover{color:var(--p1);background:#f2effb}
  .tab.on{background:var(--bg);border-color:var(--line);color:var(--p1);font-weight:600;
    box-shadow:0 -1px 0 var(--p1) inset}
  main{flex:1 1 auto;display:flex;min-height:0;border-top:1px solid var(--line)}
  #stage{flex:1 1 auto;overflow:auto;position:relative;padding:16px}
  aside{
    flex:0 0 340px;background:var(--panel);border-left:1px solid var(--line);
    overflow:auto;padding:16px 18px;
  }
  aside h3{font-size:14px;margin-bottom:4px;color:var(--p1)}
  aside .meta{font-size:11.5px;color:var(--ink3);margin-bottom:12px}
  aside .blk{margin-bottom:13px}
  aside .blk b{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;
    letter-spacing:.4px;margin-bottom:3px}
  aside .blk p{font-size:12.5px;color:var(--ink2)}
  aside .tag{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:20px;
    background:var(--p4);color:var(--p1);margin:2px 3px 2px 0}
  .empty{color:var(--ink3);font-size:12.5px;padding-top:8px}

  svg{display:block;margin:0 auto;max-width:100%;height:auto}
  .node{cursor:pointer;transition:.15s}
  .node:hover .nbody{filter:brightness(.96)}
  .node.sel .nbody{stroke:var(--p1);stroke-width:3}
  .nbody{transition:.15s}
  .nlabel{font-size:12px;font-weight:600;fill:#fff;pointer-events:none;
    text-anchor:middle;dominant-baseline:middle}
  .nsub{font-size:9.5px;fill:rgba(255,255,255,.85);text-anchor:middle;
    dominant-baseline:middle;pointer-events:none}
  .ring{fill:none;stroke:#cfc9e2;stroke-dasharray:4 6}
  .link{stroke:#c9c2e0;stroke-width:1.2;stroke-dasharray:3 4;fill:none}
  .ringlab{font-size:10px;fill:var(--ink3);text-anchor:middle}
  /* 通用卡片 */
  .grid{display:grid;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--p3);transform:translateY(-1px);
    box-shadow:0 3px 12px rgba(109,40,217,.08)}
  .card.sel{border-color:var(--p1);box-shadow:0 0 0 2px var(--p4)}
  .card h4{font-size:13px;margin-bottom:5px}
  .card p{font-size:11.5px;color:var(--ink2)}

  .plane{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 15px;margin-bottom:10px;border-left:4px solid var(--p2)}

  .plane h4 em{font-style:normal;font-size:10.5px;color:var(--ink3)}
  .plane p{font-size:11.5px;color:var(--ink2);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;padding:3px 9px;border-radius:6px;background:#f2effb;
    color:var(--p1);border:1px solid var(--p4);cursor:pointer}
  .chip:hover{background:var(--p4)}
  /* 历史层 */
  .layer{display:flex;gap:14px;align-items:flex-start;margin-bottom:0;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;
    padding:13px 16px;cursor:pointer}
  .layer:first-of-type{border-radius:10px 10px 0 0}
  .layer:last-of-type{border-radius:0 0 10px 10px;border-bottom:1px solid var(--line)}
  .layer:hover{background:#faf9fe}
  .layer .lno{flex:0 0 42px;font-weight:700;color:var(--p1);font-size:15px}
  .layer .lbody{flex:1}
  .layer h4{font-size:13px;margin-bottom:3px}
  .layer p{font-size:11.5px;color:var(--ink2)}
  /* 谱系 */
  .gspec{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .gcell{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;cursor:pointer;transition:.15s}
  .gcell:hover{border-color:var(--p3);transform:translateY(-1px)}
  .gcell.sel{border-color:var(--p1);box-shadow:0 0 0 2px var(--p4)}
  .gcell .gn{font-size:12.5px;font-weight:600;margin-bottom:3px}
  .gcell .gc{font-size:10.5px;color:var(--ink3)}
  .rate{display:inline-block;width:20px;text-align:center;font-size:10.5px;
    font-weight:700;border-radius:4px;color:#fff;margin-right:3px}
  /* 表 */
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
  table td:nth-child(3){min-width:250px}
  table th:nth-child(1),table td:nth-child(1){width:34px}
  table th:nth-child(4),table td:nth-child(4){width:56px}
  table th:nth-child(5),table td:nth-child(5){width:82px}
  table th:nth-child(6),table td:nth-child(6){width:54px}
  table th:nth-child(7),table td:nth-child(7){width:118px}
  th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#f2effb;color:var(--p1);font-size:11px;font-weight:600;
    letter-spacing:.3px;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  tr.hi td{background:#fdf6e3}
  .num{font-variant-numeric:tabular-nums;font-weight:600}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;
    font-size:11.5px;color:var(--ink2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;
    margin-right:5px;vertical-align:-1px}
  h2.sec{font-size:14px;margin:0 0 12px;color:var(--p1)}
  .note{font-size:11.5px;color:var(--ink2);background:#f2effb;border-left:3px solid var(--p3);
    padding:9px 12px;border-radius:0 7px 7px 0;margin-bottom:14px}
  @media(max-width:920px){aside{flex-basis:280px}}
  @media(max-width:720px){main{flex-direction:column}aside{flex:0 0 auto;border-left:none;border-top:1px solid var(--line)}}
</style>
</head>

const side = document.getElementById('side');
function md(s){return s.replace(/\*\*(.+?)\*\*/g,'<b style="color:#6d28d9">$1</b>')}
function renderSide(o){
  if(!o){side.innerHTML='<div class="empty">← 点击任意节点查看详情</div>';return}
  let h = '<h3>'+o.name+'</h3>';
  if(o.sub) h += '<div class="meta">'+o.sub+(o.tier!==undefined&&o.tier!==null?'　·　'+TIER[o.tier]:'')+'</div>';
  if(o.tag) h += '<div class="blk">'+o.tag.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>';
  if(o.b||o.blocks){
    (o.b||o.blocks).forEach(([k,v])=>{h+='<div class="blk"><b>'+k+'</b><p>'+md(v)+'</p></div>'});
  }
  side.innerHTML = h;
  side.scrollTop = 0;
}

function viewPlane(){

   + '把位面分类学套在莲花地图上，每张花瓣地图的「特殊规则」就<b>不需要额外解释</b>——读者知道位面类型，就能自己推出来。</div>';
  PLANES.forEach(p=>{
    s+='<div class="plane"><h4>'+p.name+'<em>'+p.en+'</em></h4><p>'+md(p.p)+'</p>'
     + '<div class="chips">'+p.maps.map(m=>'<span class="chip">'+m+'</span>').join('')+'</div></div>';
  });

   + '这也回答了那个最容易被挑刺的问题：<b>综网不造副本，它只是在位面里挑一个。</b></div>';

     + '<div class="gc" style="margin-top:4px">弱点：'+(sp.n==='未归档'?'未知':sp.w)+'</div></div>';
  });
  s+='</div>';
  s+='<div class="note" style="margin-top:14px"><b>原创怪的谱系归位</b>：灰犬＝怪兽｜水蛭傀儡＝泥怪｜货架守卫＝构装｜索道员＝亡灵｜菌斗兽＝植物｜斯兰达人＝异怪；'
   + '而 <b>到站物</b> 与 <b>深空实体</b> 标注为 <b>「未归档」</b>——综网只有 13 个谱系，它俩不在其中。<b>这本身就是前置文明的伏笔。</b></div>';
  s+='<div class="note"><b>F7 的技术解释</b>：灰犬从不补刀，是因为按怪兽谱系规则它循本能捕食——'
   + '而一个静止不动、体温被压到最低的目标，在它的本能里<b>不算猎物</b>。陆沉活下来靠的不是系统偏爱，是他后来才想明白的谱系常识。</div>';
  return s;
}

/* ============================================================
   视图 5 · 人物关系
   ============================================================ */
function viewChars(){
  const NS='http://www.w3.org/2000/svg';
  let s='<svg viewBox="0 0 1000 640" width="1000" style="max-width:100%">';
  CHARS.filter(c=>!c.core).forEach(c=>{
    s+='<line class="link" x1="'+c.x+'" y1="'+c.y+'" x2="500" y2="330" stroke-width="1.5"/>';
  });
  CHARS.forEach(c=>{
    if(c.core) return;
    const w=118,h=42,x=c.x-w/2,y=c.y-h/2;
    const col = c.n==="闻人驭"?"#991b1b":(c.n==="收割者"?"#374151":"#6d28d9");
    s+='<g class="node" data-cid="'+c.n+'">'
     + '<rect class="nbody" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+col+'"/>'
     + '<text class="nlabel" x="'+c.x+'" y="'+(c.y-5)+'" font-size="12">'+c.n+'</text>'
     + '<text class="nsub" x="'+c.x+'" y="'+(c.y+11)+'">'+c.r+'</text></g>';
  });
  const c0=CHARS[0];
  s+='<g class="node" data-cid="陆沉"><circle class="nbody" cx="500" cy="330" r="62" fill="#3b0f7a"/>'
   + '<text class="nlabel" x="500" y="322" font-size="18">陆沉</text>'
   + '<text class="nsub" x="500" y="342">六维全 1</text>'
   + '<text class="nsub" x="500" y="358">逆命者</text></g>';
  s+='</svg>';
  s+='<div class="note" style="margin-top:14px"><b>卫星式群像三型</b>（缺一不可）：'
   + '<b>对等竞争者</b>＝裴战 → 闻人驭｜<b>兜底守护导师</b>＝老周（全卷只出手三次）｜<b>喜剧调剂</b>＝九斤。'
   + '点击任一节点查看完整档案（含属性面板、want/need、台词样本）。</div>';
  return s;
}

/* ============================================================
   视图 6 · 逆命值账本
   ============================================================ */
function viewLedger(){
  let s='<div class="note"><b>递减规则</b>：同一次进入副本内，重复同一种大失败，结算点数<b>逐次减半</b>（1/2、1/4……最低 1 点）；跨副本重置。'
   + '所以反复挨打刷不出钱，<b>只有换着花样输才值钱</b>。</div>';
  const W=960,H=170,pad=40;
  const maxV=40;
  const px=i=>pad+i*((W-pad*2)/(LEDGER.length-1));
  const py=v=>H-20-(v/maxV)*(H-45);
  let pts=LEDGER.map((r,i)=>px(i)+','+py(r[4])).join(' ');
  s+='<svg viewBox="0 0 '+W+' '+H+'" width="960" style="max-width:100%">';
  s+='<line x1="'+pad+'" y1="'+(H-20)+'" x2="'+(W-pad)+'" y2="'+(H-20)+'" stroke="#e3e0ee"/>';
  s+='<polyline points="'+pts+'" fill="none" stroke="#6d28d9" stroke-width="2.4"/>';
  LEDGER.forEach((r,i)=>{
    const big = r[6].indexOf('★')>=0 || /Catalyst|Midpoint|All Is Lost|Break|爽点|高潮|决战/.test(r[6]);
    s+='<circle cx="'+px(i)+'" cy="'+py(r[4])+'" r="'+(big?4.5:3)+'" fill="'+(big?'#d94a4a':'#6d28d9')+'"/>';
    if(big) s+='<text x="'+px(i)+'" y="'+(py(r[4])-((i%2===0)?9:23))+'" font-size="8.5" fill="#d94a4a" text-anchor="middle">'+r[6].replace(/\*/g,'')+'</text>';
  });
  s+='<text x="'+pad+'" y="14" font-size="10" fill="#8b93a7">逆命值结余曲线（上限＝10×等级）</text>';
  s+='</svg>';
  s+='<table style="margin-top:8px"><thead><tr>'
   + '<th>章</th><th>地点</th><th>事件</th><th>变动</th><th>结余</th><th>等级</th><th>节拍</th></tr></thead><tbody>';
  LEDGER.forEach(r=>{
    const hi = /★|Catalyst|Midpoint|All Is Lost|Break|爽点|高潮|决战/.test(r[6]);
    s+='<tr class="'+(hi?'hi':'')+'"><td class="num">'+r[0]+'</td><td>'+r[1]+'</td><td>'+md(r[2])+'</td>'
     + '<td class="num" style="color:'+(r[3]<0?'#d94a4a':(r[3]>0?'#0e9f6e':'#8b93a7'))+'">'+(r[3]>0?'+':'')+r[3]+'</td>'
     + '<td class="num">'+r[4]+' / '+(r[5]*10)+'</td><td>'+r[5]+'</td><td>'+md(r[6])+'</td></tr>';
  });
  s+='</tbody></table>';
  s+='<div class="note" style="margin-top:14px"><b>数值骨架</b>：等级—上限—能力严格咬合——'
   + '1 级上限 10（翻命）｜2 级上限 20（逆命之刃）｜3 级 30｜4 级 40｜<b>5 级上限 50（改判）</b>。'
   + '第 11 章的逆命之刃在数值上不可能实现，因此改为「第二次翻命」，<b>逆命之刃的首秀移到第 18 章</b>，'
   + '让全卷最大的爆发落在全卷最大的高潮上。</div>';
  return s;
}

/* ============================================================
   交互
   ============================================================ */
const VIEWS=[
  ["世界地图",viewMap],["位面结构",viewPlane],["历史千层饼",viewHistory],
  ["怪物谱系",viewSpecies],["人物关系",viewChars],["逆命值账本",viewLedger]
];
let cur=0;
const stage=document.getElementById('stage'), tabs=document.getElementById('tabs');
VIEWS.forEach((v,i)=>{
  const b=document.createElement('button');
  b.className='tab'+(i===0?' on':''); b.textContent=v[0];
  b.onclick=()=>{cur=i;switchTab()};
  tabs.appendChild(b);
});
function switchTab(){
  [...tabs.children].forEach((b,i)=>b.classList.toggle('on',i===cur));
  stage.innerHTML=VIEWS[cur][1]();
  bind();
  renderSide(null);
}
function bind(){
  stage.querySelectorAll('.node').forEach(n=>{
    n.onclick=()=>{
      stage.querySelectorAll('.node').forEach(m=>m.classList.remove('sel'));
      n.classList.add('sel');
      const id=n.dataset.id;
      if(id){
        if(id==='core') return renderSide(CORE);
        const p=PETALS.find(x=>x.id===id); if(p) return renderSide(p);
      }
      const cid=n.dataset.cid;
      if(cid){
        const c=CHARS.find(x=>x.n===cid);
        if(c) return renderSide({name:c.n,sub:c.r,tag:null,b:c.b,
          blocks:null});
      }
    };
  });
  stage.querySelectorAll('.gcell').forEach(g=>{
    g.onclick=()=>{
      stage.querySelectorAll('.gcell').forEach(m=>m.classList.remove('sel'));
      g.classList.add('sel');
      const sp=SPECIES[+g.dataset.sp];
      renderSide({name:sp.n,sub:"怪物谱系",tag:[sp.c?sp.c+" 条目":"未归档"],
        blocks:[["共同特征",sp.note],["弱点规律",sp.w],
          ["怪物池",sp.m.map(x=>"**"+x[0]+"**（"+x[1]+"）").join("　")]]});
    };
  });
}
switchTab();
renderSide({name:"综网 · 废柴逆命",sub:"世界地图 v1.0",tag:["花芯＝狱","7 花瓣","13 谱系","5 层历史","20 章账本"],
  blocks:[
    ["怎么用","点击上方标签切换六个视图；点击任意节点查看详情。"],
    ["世界地图","莲花地图法：花芯「狱」在中心，八张花瓣地图环绕，虚线表示每次离开花瓣都必须回花芯。"],
    ["设定来源","全部信息来自设定库 00-17 号文档；规则机制实读自本地 24 部无限流 TRPG 规则书与 D&amp;D 5e 中文核心书。"],
    ["文档层级","冲突时优先级：07/08 &gt; 05/06 &gt; 01/02。"]
  ]});
</script>
