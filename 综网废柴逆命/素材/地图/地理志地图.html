<!DOCTYPE html>

<meta charset="utf-8">

<style>
  :root{
    --bg:#f6f5fa; --panel:#ffffff; --line:#e3e0ee;
    --ink:#1f2430; --ink2:#5b6377; --ink3:#8b93a7;
    --p1:#6d28d9; --p2:#7c3aed; --p4:#ddd6fe;
    --core:#3b0f7a; --hot:#d94a4a; --ok:#0e9f6e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;
  }
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:11px 18px;flex:0 0 auto}
  .h-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;font-weight:700;letter-spacing:.4px}
  h1 span{color:var(--p1)}
  .sub{font-size:11.5px;color:var(--ink3)}
  .switch{margin-left:auto;display:flex;gap:6px}
  .sbtn{padding:6px 14px;font-size:12.5px;border:1px solid var(--line);background:#fff;
    color:var(--ink2);border-radius:7px;cursor:pointer;font-family:inherit;transition:.15s}
  .sbtn:hover{border-color:var(--p2);color:var(--p1)}
  .sbtn.on{background:var(--p1);border-color:var(--p1);color:#fff;font-weight:600}
  main{flex:1 1 auto;display:flex;min-height:0}
  #wrap{flex:1 1 auto;position:relative;min-width:0}
  #map{width:100%;height:100%}
  #legend{
    position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.96);
    border:1px solid var(--line);border-radius:9px;padding:10px 13px;
    font-size:11.5px;color:var(--ink2);line-height:1.95;max-width:340px;
    box-shadow:0 2px 10px rgba(31,36,48,.08)
  }
  #legend b{display:block;color:var(--p1);font-size:11.5px;margin-bottom:4px}
  #legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  #tip{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:16px 22px;font-size:13px;color:var(--ink2);display:block;text-align:center;
    box-shadow:0 3px 14px rgba(31,36,48,.08)
  }
  aside{flex:0 0 336px;background:var(--panel);border-left:1px solid var(--line);
    overflow:auto;padding:16px 18px}
  aside h3{font-size:14px;margin-bottom:4px;color:var(--p1)}
  aside .meta{font-size:11.5px;color:var(--ink3);margin-bottom:12px}
  aside .blk{margin-bottom:13px}
  aside .blk b{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;
    letter-spacing:.4px;margin-bottom:3px}
  aside .blk p{font-size:12.5px;color:var(--ink2)}
  .tag{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:20px;
    background:var(--p4);color:var(--p1);margin:2px 3px 2px 0}
  .empty{color:var(--ink3);font-size:12.5px;padding-top:8px}
  .note{font-size:11.5px;color:var(--ink2);background:#f2effb;
    border-left:3px solid var(--p2);padding:9px 12px;border-radius:0 7px 7px 0;margin-bottom:13px}
  @media(max-width:860px){main{flex-direction:column}aside{flex:0 0 auto;border-left:none;border-top:1px solid var(--line)}}
</style>
</head>

/* ============================================================
   侧栏
   ============================================================ */
const side=document.getElementById('side');
const md=s=>s.replace(/\*\*(.+?)\*\*/g,'<b style="color:#6d28d9">$1</b>');
function renderSide(o){
  if(!o){side.innerHTML='<div class="empty">点击地图上的任意标记或圆环查看详情</div>';return}
  let h='<h3>'+o.name+'</h3>';
  if(o.sub) h+='<div class="meta">'+o.sub+'</div>';
  if(o.tag) h+='<div class="blk">'+o.tag.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>';
  if(o.note) h+='<div class="note">'+md(o.note)+'</div>';
  (o.b||[]).forEach(([k,v])=>{h+='<div class="blk"><b>'+k+'</b><p>'+md(v)+'</p></div>'});
  side.innerHTML=h; side.scrollTop=0;
}

/* ============================================================
   内联 SVG 图标（不引用任何外部图片）
   ============================================================ */
function pin(fill, r){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+ (r*2) +'" height="'+ (r*2.6) +'" viewBox="0 0 26 34">'
    + '<path d="M13 .8C6.2.8.8 6.2.8 13c0 9.1 12.2 20.2 12.2 20.2S25.2 22.1 25.2 13C25.2 6.2 19.8.8 13 .8z" fill="'+fill+'"/>'
    + '<circle cx="13" cy="13" r="4.6" fill="#ffffff"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const ICON = {
  def:  pin('#6d28d9', 13),
  home: pin('#d94a4a', 17),
  city: pin('#0e9f6e', 12)
};

/* ============================================================
   地图
   ============================================================ */
let map, markerLayer, circleLayer, view='nation';

function initMap(){
  map = new TMap.Map('map', {
    zoom: 5,
    center: new TMap.LatLng(34.0, 106.5),
    viewMode: '2D'
  });

  markerLayer = new TMap.MultiMarker({
    map: map,
    styles:{
      def: new TMap.MarkerStyle({
        width:26, height:34, anchor:{x:13,y:34}, src:ICON.def,
        color:'#1f2430', size:13, direction:'bottom', offset:{x:0,y:7},
        padding:'4px 9px', backgroundColor:'#ffffff',
        backgroundBorderRadius:6, backgroundBorderWidth:1, backgroundBorderColor:'#e3e0ee'
      }),
      home: new TMap.MarkerStyle({
        width:34, height:44, anchor:{x:17,y:44}, src:ICON.home,
        color:'#b91c1c', size:14, direction:'bottom', offset:{x:0,y:8},
        padding:'5px 11px', backgroundColor:'#fff5f5',
        backgroundBorderRadius:6, backgroundBorderWidth:1, backgroundBorderColor:'#fca5a5'
      }),
      city: new TMap.MarkerStyle({
        width:24, height:32, anchor:{x:12,y:32}, src:ICON.city,
        color:'#0e6b4a', size:12.5, direction:'bottom', offset:{x:0,y:6},
        padding:'3px 8px', backgroundColor:'#ffffff',
        backgroundBorderRadius:6, backgroundBorderWidth:1, backgroundBorderColor:'#a7f3d0'
      })
    },
    geometries: []
  });

  circleLayer = new TMap.MultiCircle({
    map: map,
    styles:{ def: new TMap.CircleStyle({
      color:'rgba(109,40,217,0.05)', showBorder:true,
      borderColor:'#6d28d9', borderWidth:2
    })},
    geometries: []
  });

  markerLayer.on('click', function(e){
    const g=e.geometry; if(!g) return;
    const src = (g.id.charAt(0)==='c') ? CITY.places : NATION;
    const o = src.filter(function(x){return x.id===g.id})[0];
    if(o) renderSide({name:o.name, tag:o.tag, note:o.note, b:o.b});
  });

  circleLayer.on('click', function(e){
    const g=e.geometry; if(!g) return;
    const r = CITY.rings.filter(function(x){return x.name===g.id})[0];
    if(r) renderSide({name:r.name, sub:r.tier+'　·　半径 '+r.radius+' m', note:r.note, b:r.b});
  });

  document.getElementById('tip').style.display='none';
}

function flyTo(z, lat, lng){
  map.setZoom(z);
  map.setCenter(new TMap.LatLng(lat, lng));
}

function drawNation(){
  view='nation';
  flyTo(5, 34.0, 106.5);
  circleLayer.setGeometries([]);
  markerLayer.setGeometries(NATION.map(function(r){
    return { id:r.id, styleId: r.home?'home':'def',
             position:new TMap.LatLng(r.pos[0], r.pos[1]), content:r.name + (r.home?' ★':'') };
  }));
  document.getElementById('legend').innerHTML =
      '<b>全国 · 综网接入区划</b>'
    + '<div><i style="background:#6d28d9"></i>甲等接入区（城心 · 高墙）</div>'
    + '<div><i style="background:#a78bfa"></i>乙等服役区</div>'
    + '<div><i style="background:#0e9f6e"></i>丙等居民区</div>'
    + '<div><i style="background:#d94a4a"></i>序列营聚集地</div>'
    + '<div style="margin-top:5px;color:#8b93a7">★ ＝ 主角所在的第三区　·　点击标记查看详情</div>';
}

function drawCity(){
  view='city';
  flyTo(12, CITY.center[0], CITY.center[1]);
  markerLayer.setGeometries(CITY.places.map(function(p){
    return { id:p.id, styleId:'city',
             position:new TMap.LatLng(p.pos[0], p.pos[1]), content:p.name };
  }));
  // 大圈先渲染、小圈在上层；每层使用各自的描边色
  var ordered = CITY.rings.slice().sort(function(a,b){ return b.radius - a.radius; });
  var styles = {};
  ordered.forEach(function(r, i){
    styles['ring'+i] = new TMap.CircleStyle({
      color:'rgba(109,40,217,0.045)', showBorder:true,
      borderColor:r.color, borderWidth:2
    });
    r.__sid = 'ring'+i;
  });
  circleLayer.setStyles(styles);
  circleLayer.setGeometries(ordered.map(function(r){
    return { id:r.name, styleId:r.__sid,
             center:new TMap.LatLng(CITY.center[0], CITY.center[1]), radius:r.radius };
  }));
  document.getElementById('legend').innerHTML =
      '<b>第三区 · 主世界空间层级</b>'
    + CITY.rings.map(function(r){
        return '<div><i style="background:'+r.color+'"></i>'+r.name
             + '　<span style="color:#8b93a7">'+r.tier+'</span></div>';
      }).join('')
    + '<div style="margin-top:5px;color:#8b93a7">圈层由内到外＝阶层由高到低　·　点击圆环或标记查看详情</div>';
}

    note: msg,
    b:[
      ['怎么打开','请通过 WorkBuddy 内置预览打开本文件。腾讯地图 JavaScript API **明确不支持 file:// 协议**（官方限制），本地双击打开时底图无法加载。'],
      ['打开后','右上角切换「全国 · 接入区划」与「第三区 · 空间层级」；点击标记或圆环查看详情。'],
      ['为什么需要这张图','莲花结构图回答「综网怎么组织」，这张地理图回答「它铺在什么地面上」——两者互补。'],
      ['领土合规','底图为腾讯地图，领土要素完全符合国家标准，**未作任何改动**；虚构图层仅以标记与圆环叠加。']
    ]
  });
}

function boot(){
  const tip=document.getElementById('tip');
  if(location.protocol === 'file:'){
    tip.innerHTML='本文件需在 http/https 下打开。<br><span style="color:#8b93a7;font-size:12px">'
      + '腾讯地图 API 不支持 file:// 协议——请通过 WorkBuddy 内置预览打开。</span>';
    offlineSide('当前以本地文件方式打开，地图服务受限；**设定内容仍可在右侧栏查看**。');
    return;
  }
  if(typeof TMap === 'undefined'){
    tip.innerHTML='地图服务未能加载。<br><span style="color:#8b93a7;font-size:12px">请检查网络后重试。</span>';
    offlineSide('地图服务未加载；**设定内容仍可在右侧栏查看**。');
    return;
  }
  try{
    initMap();
    drawNation();

    document.getElementById('btnNation').onclick=function(){
      this.classList.add('on');
      document.getElementById('btnCity').classList.remove('on');
      drawNation(); renderSide(null);
    };
    document.getElementById('btnCity').onclick=function(){
      this.classList.add('on');
      document.getElementById('btnNation').classList.remove('on');
      drawCity(); renderSide(null);
    };

    renderSide({
      name:'综网 · 废柴逆命', sub:'地理志地图 v1.0',
      tag:['全国 9 接入区','第三区 5 层圈','底图合规'],
      note:'底图为腾讯地图（领土要素符合国家标准，**未作任何改动**）；所有标记与圈层均为小说虚构设定。',
      b:[
        ['怎么用','右上角切换「全国 · 接入区划」与「第三区 · 空间层级」；点击标记或圆环查看详情。'],
        ['为什么需要这张图','莲花结构图回答「综网怎么组织」，这张地理图回答「它铺在什么地面上」——两者互补。'],
        ['与莲花地图的对应','第三区 ＝ 花瓣①（底色地图）；练习副本入口 ＝ 花芯「狱」的现实接口。'],
        ['领土合规','虚构图层仅以标记与圆环叠加，不涉及任何边界、地名或领土要素的描绘改动。']
      ]
    });

    // 兜底：4 秒后若底图仍无 canvas，说明渲染失败，给出明确提示
    setTimeout(function(){
      if(!document.querySelector('#map canvas')){
        tip.style.display='block';
        tip.innerHTML='底图未能渲染。<br><span style="color:#8b93a7;font-size:12px">'
          + '请确认网络可用，并通过 WorkBuddy 内置预览打开本文件。</span>';
      }
    }, 4000);

  }catch(err){
    tip.style.display='block';
    tip.innerHTML='地图初始化失败：' + ((err && err.message) ? err.message : String(err));
  }
}
if(document.readyState === 'complete') boot();
else window.addEventListener('load', boot);
</script>
</body>
</html>
