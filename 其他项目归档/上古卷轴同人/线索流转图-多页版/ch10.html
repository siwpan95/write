<h1>第 10 章《名单上的第七笔》<span class="loc">白漫城 · 祭坛</span></h1>
<div class="rule"></div>
<div class="field"><div class="k">一句话</div><p>账合上了，你的名字出现了。</p></div>
<div class="field"><div class="k">对手戏 · 戏眼</div><p class="eye">梭默线人：「这上面有三个名字，和三个空位。你只要说一句『这里没有人』，我就走。」你低头看见第四个空位——刻痕是新的。</p></div>
<div class="field"><div class="k">代价结算</div><p>交名单：祭坛被拆，信仰转入地下；烧名单：人四散、祭坛保住，你成为第七笔；划掉名字：你成了记账的人。</p></div>
<div class="field"><div class="k">递交</div><p>收尾：风把盐吹散，石头是凉的。老神不会发怒，他们只是不再回应——而账，永远有人接着记。</p></div>
