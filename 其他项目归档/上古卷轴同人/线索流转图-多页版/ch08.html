<h1>第 8 章《借声的人》<span class="loc">风舵城</span></h1>
<div class="rule"></div>
<div class="field"><div class="k">一句话</div><p>他在说话，但说话的不是他。</p></div>
<div class="field"><div class="k">对手戏 · 戏眼</div><p class="eye">他抓住你的袖子，用回自己的声音：「别让我再说话了。我每说一句，它就多学一句。」</p></div>
<div class="field"><div class="k">代价结算</div><p>烧掉则村民暴动、你被赶出城；交出去则他成为标本；带去高吼峰则十天路程、每夜一次「借声」。</p></div>
<div class="field"><div class="k">递交</div><p>伊士冉给你一片封石拓片——他最后说的话，是佛克瑞斯某座墓门上的刻文。</p></div>
