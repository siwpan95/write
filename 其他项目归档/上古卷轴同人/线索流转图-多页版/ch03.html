<h1>第 3 章《地窖里的甜味》<span class="loc">白漫城 · 蜜之酿酒庄</span></h1>
<div class="rule"></div>
<div class="field"><div class="k">一句话</div><p>毒不写在酒里，写在「谁赔得起」上。</p></div>
<div class="field"><div class="k">对手戏 · 戏眼</div><p class="eye">酒庄主人：「我的女儿在楼上，她今天早上还在数酒桶。」印达林：「码头工每天都有人掉下去。」</p></div>
<div class="field"><div class="k">代价结算</div><p>你指认谁，谁就消失——酒庄倒闭三十人失业，或黑棘撤手但毒继续流。</p></div>
<div class="field"><div class="k">递交</div><p>桶底刮出一枚刻号酒桶箍：不是白漫的编号，是鸦石镇矿场的编号。</p></div>
