<h1>第 9 章《第三道门》<span class="loc">佛克瑞斯</span></h1>
<div class="rule"></div>
<div class="field"><div class="k">一句话</div><p>你们家拜了三十年，拜的是一座门。</p></div>
<div class="field"><div class="k">对手戏 · 戏眼</div><p class="eye">族长：「那我们拜了三十年，拜的是谁？」伊士冉：「拜的是一座门。门后面有东西在等有人叫它。」</p></div>
<div class="field"><div class="k">代价结算</div><p>炸塌墓道，族史与线索一起埋；让长子独入，他抱出不属于他家的东西；上报，封条写别人的名字。</p></div>
<div class="field"><div class="k">递交</div><p>拓片与祭坛石的刻痕完全一致——那份「约」的签约地，是白漫城外的塔洛斯祭坛。</p></div>
