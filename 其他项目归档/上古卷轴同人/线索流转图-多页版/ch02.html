<h1>第 2 章《夹墙里的名字》<span class="loc">裂谷城</span></h1>
<div class="rule"></div>
<div class="field"><div class="k">一句话</div><p>账本不值钱，值钱的是「谁的名字不在上面」。</p></div>
<div class="field"><div class="k">对手戏 · 戏眼</div><p class="eye">玛雯：「你开锁的声音很好听。可惜你听见了不该听的。」威克斯：「她不是在威胁你。她是在报价。」</p></div>
<div class="field"><div class="k">代价结算</div><p>账本只有一份，三方都要。交出去的那一刻，你失去另外两方——此后每条巷子都要先看后面。</p></div>
<div class="field"><div class="k">递交</div><p>账本第三页反复出现：「蜜酒三桶，白漫，收货人印达林」，旁注「石料另计」。</p></div>
