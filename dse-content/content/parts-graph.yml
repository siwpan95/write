    text: "代价记账法（可数、可累加、归因唯一）（WB-MECH-0004）｜band: **L2**（recover 判定）｜target: 财／身 ｜ recover: 条件（还账） ｜ 记在账上可还，但账…｜phase: **设 → 压**——先立「用必上账」，后按账额递增｜可咬合 7 件：认纹不认人（WB-ART-0014）、资源成环（WB-ART-0027）、划名机制（WB-INFO-0017）、记录即存在（WB-INST-0001）、不可逆代价（WB-INST-0002）、代价不可解（WB-MECH-0008）、越用越像它（能力同化）（WB-MECH-0020）"
    onEnter:
      visits:
        wb-mech-0004: +1
    choices:
      - text: "（本件可咬合 7 件 —— 见上）"
        goto: hub
  wb-mech-0005:
    title: "归因链三层"
    text: "归因链三层（WB-MECH-0005）｜band: **L1**（recover 判定）｜target: 无 ｜ recover: ——（诊断工具，本身不取走东西） ｜ 诊…｜phase: **设**——建立「缺陷有三层」的认知；不作「压」「翻」｜**元件**（不产生咬合边）｜可咬合 0 件（元件）"
    onEnter:
      visits:
        wb-mech-0005: +1
    choices:
      - text: "（无咬合件 —— 元）"
        goto: hub
  wb-mech-0006:
    title: "认知不可通约"
    text: "认知不可通约（WB-MECH-0006）｜band: **L2**（recover 判定）｜target: 时／势 ｜ recover: 条件（付重复成本） ｜ 拿走理解效率…｜phase: **设**——建立「传达有硬上限」；不宜「压」（重复本身即代价，已含在规则里）｜可咬合 3 件：重复次数即货币（WB-ECON-0011）、名分阶梯（WB-INFO-0016）、记录即存在（WB-INST-0001）"
    onEnter:
      visits:
        wb-mech-0006: +1
    choices:
      - text: "（本件可咬合 3 件 —— 见上）"
        goto: hub
  wb-mech-0007:
    title: "描述即约束"
    text: "描述即约束（WB-MECH-0007）｜band: **L3**（recover 判定）｜target: 秘／身 ｜ recover: 不可完全补（反噬已发生） ｜ 写错一…｜phase: **设 → 翻**——先立「描述即约束」；后在「说清它还是不惊动它」处翻转｜可咬合 3 件：篡改痕迹符号系统（WB-ART-0019）、焚卷旧账（WB-HIST-0013）、不可逆代价（WB-INST-0002）"
    onEnter:
      visits:
        wb-mech-0007: +1
    choices:
      - text: "进入装配体 CCZ-0004"
        goto: ccz-0004-step0
      - text: "进入装配体 CCZ-0007"
        goto: ccz-0007-step0
      - text: "进入装配体 CCZ-0010"
        goto: ccz-0010-step0
      - text: "（本件可咬合 3 件 —— 见上）"
        goto: hub
  wb-mech-0008:
    title: "代价不可解"
    text: "代价不可解（WB-MECH-0008）｜band: **L3**（recover 判定）｜target: 身／信 ｜ recover: 不可逆 ｜ 拿走一部分自己，且不许问…｜phase: **设 → 压**——先立「代价不可解释」；后每次调用都再少一样｜可咬合 3 件：不可逆代价（WB-INST-0002）、代价记账法（可数、可累加、归因唯一）（WB-MECH-0004）、越用越像它（能力同化）（WB-MECH-0020）"
    onEnter:
      visits:
        wb-mech-0008: +1
    choices:
      - text: "进入装配体 CCZ-0008"
        goto: ccz-0008-step0
      - text: "（本件可咬合 3 件 —— 见上）"
        goto: hub
  wb-mech-0020:
    title: "越用越像它（能力同化）"
    text: "越用越像它（能力同化）（WB-MECH-0020）｜band: **L3**（recover 判定）｜target: 信／名 ｜ recover: 不可逆（降阶不退还） ｜ 拿走「作为…｜phase: **压 → 翻**——每次升级是「压」；旁人先看出来而自己最后察觉，是「翻」｜可咬合 5 件：资源成环（WB-ART-0027）、专长归零（WB-GEO-0023）、名分阶梯（WB-INFO-0016）、代价记账法（可数、可累加、归因唯一）（WB-MECH-0004）、代价不可解（WB-MECH-0008）"
    onEnter:
      visits:
        wb-mech-0020: +1
    choices:
      - text: "（本件可咬合 5 件 —— 见上）"
        goto: hub
  wb-mech-0021:
    title: "以屈辱为燃料"
    text: "以屈辱为燃料（WB-MECH-0021）｜band: **L2**（recover 判定）｜target: 名／财 ｜ recover: 条件（再受辱可再入账） ｜ 拿走时间…｜phase: **设 → 压**——先立「受辱且不折腰才入账」；后每次受辱都是加压｜可咬合 3 件：名分兑换率（WB-ECON-0012）、名分阶梯（WB-INFO-0016）、职格互斥（制度性悲剧发生器）（WB-INST-0003）"
    onEnter:
      visits:
        wb-mech-0021: +1
    choices:
      - text: "（本件可咬合 3 件 —— 见上）"
        goto: hub
